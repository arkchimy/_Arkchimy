// 게임 서버 실행 설정 (BOM 없는 UTF-8 - ParserLib가 BOM을 키로 읽는다)
port = 33000;
backlog = 512;
workerCnt = 2;
iocpConcurrency = 0;
slotCnt = 500;
maxSession = 1000;
gqcsEx = 1;
gqcsBatch = 64;
skipOnSuccess = 1;
mergeSends = 1;
sendStallSec = 10;
sendBufZero = 0;
testSendCompleteDelayMs = 0;
// 운영 툴이 접속하는 운영자 포트(0이면 끔) - 키는 db.cfg의 adminKey
adminPort = 33001;
// 로그인 서버 포트(로그인 서버도 이 파일의 네트워크 설정을 쓴다)
loginPort = 33002;
// 로그인 서버: 접속하거나 응답한 뒤 이 시간(초) 안에 요청이 없으면 끊는다(0이면 끔) - 아무것도 보내지 않는 연결이 세션 칸을 채우지 못하게
loginIdleSec = 10;
// 로그인 서버: 미리 만들어 둘 서버 임시 RSA 키 쌍 수(설계 login_rsa_change.docx 2-7) - 다 떨어지면 새 접속은 끊는다. 하나에 약 50ms라 시작이 그만큼 늦어진다
loginKeyPool = 64;

// 게임 규칙(시나리오 표가 아니라 규칙)
playerHp = 20;
playerAttack = 2;
playerDefense = 12;
playerInvestigate = 0;
turnTimeMs = 10000;
dungeonGold = 50;
auctionDurationSec = 60;
// 접속한 뒤 이 시간(초) 안에 입장하지 않으면 끊는다(0이면 끔). 시험 클라는 띄우자마자 접속하고 사람이 가입·로그인을 치므로 짧게 두지 않는다
entryLimitSec = 60;
