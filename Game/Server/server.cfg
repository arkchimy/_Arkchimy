// 게임 서버 실행 설정 (BOM 없는 UTF-8 - ParserLib가 BOM을 키로 읽는다)
port = 33000;
backlog = 512;
workerCnt = 2;
iocpConcurrency = 0;
slotCnt = 500;
maxSession = 1000;
gqcsEx = 1;
gqcsBatch = 64;
skipOnSuccess = 1;
mergeSends = 1;
sendStallSec = 10;
sendBufZero = 0;
testSendCompleteDelayMs = 0;
// 즉시 완료 반복 상한 - 연달아 즉시 끝난 수신·송신이 이 수에 닿으면 차례를 IOCP 큐 뒤로 넘긴다. 0이면 상한 없음
skipLoopLimit = 3;
// 운영 툴이 접속하는 운영자 포트(0이면 끔) - 키는 db.cfg의 adminKey
adminPort = 33001;
// 로그인 서버 포트(로그인 서버도 이 파일의 네트워크 설정을 쓴다)
loginPort = 33002;
// 로그인 서버: 접속하거나 응답한 뒤 이 시간(초) 안에 요청이 없으면 끊는다(0이면 끔) - 아무것도 보내지 않는 연결이 세션 칸을 채우지 못하게
loginIdleSec = 10;
// 로그인 서버: 서버 임시 RSA 키 쌍 수 - 시작할 때 만들고(하나에 약 51ms라 256개면 시작이 약 13초 늦어진다, PC B) 연결이 끝나면 돌려받는다. 키는 늘 이 수만큼이라
// HelloServer를 보낸 뒤 아직 끊기지 않은 연결 수의 상한 - 다 빌려 가면 새 접속은 끊는다(키쌍부족끊김). 2026-11-20 사용자 결정: 키를 그 자리에서 만들지 않고 수를 늘린다
loginKeyPool = 256;
// 로그인 서버: 서버 임시 키 하나를 몇 연결까지 쓸지(설계 암호화_구조_결정.docx 2-3) - 1이면 접속마다 새 키. 키가 새면 그 키를 쓴 연결들의 가입·로그인 요청이 함께 풀린다
// 2026-11-21 5 → 2(사용자 결정) - 키를 다시 쓰는 연결이 하나뿐이라 같은 키로 요청을 다시 보낼 기회가 줄어든다. 대신 두 연결마다 해제하는 워커가 새 키를 만든다(약 51ms)
loginKeyMaxUse = 2;
// 로그인 서버: 로그인 성공 응답(세션 키)을 보낸 뒤 이 시간(초) 안에 클라의 확인(AuthAck)이 없으면 끊는다 - 받으면 바로 끊는다
loginAckSec = 5;

// 접속한 뒤 이 시간(초) 안에 입장하지 않으면 끊는다(0이면 끔). 시험 클라는 띄우자마자 접속하고 사람이 가입·로그인을 치므로 짧게 두지 않는다
entryLimitSec = 60;
// 입장한 뒤 이 시간(초) 동안 아무것도(하트비트 포함) 받지 못하면 끊는다(0이면 끔) - 클라는 10초마다 하트비트를 보낸다. 10초보다 커야 한다
idleLimitSec = 30;

// 모니터링 서버(Game/Monitor) 주소 - 로그인·게임 서버가 1초마다 표본을 보낸다. 0이면 보내지 않는다. 모니터가 없어도 서버는 그대로 돈다(5초마다 다시 붙기만)
monitorHost = 127.0.0.1;
monitorPort = 33010;
// 모니터에 보일 이름(영문·숫자·_·- 15자까지) - 같은 종류의 서버를 여럿 붙이면 서로 다르게(같은 이름이면 모니터가 옛 연결을 끊는다)
monitorGameName = game;
monitorLoginName = login;
