// 게임 서버 실행 설정 (BOM 없는 UTF-8 - ParserLib가 BOM을 키로 읽는다)
port = 33000;
backlog = 512;
workerCnt = 2;
iocpConcurrency = 0;
slotCnt = 500;
maxSession = 1000;
gqcsEx = 1;
gqcsBatch = 64;
skipOnSuccess = 1;
mergeSends = 1;
sendStallSec = 10;
sendBufZero = 0;
testSendCompleteDelayMs = 0;
// 운영 툴이 접속하는 운영자 포트(0이면 끔) - 키는 db.cfg의 adminKey
adminPort = 33001;
// 로그인 서버 포트(로그인 서버도 이 파일의 네트워크 설정을 쓴다)
loginPort = 33002;
// 로그인 서버: 접속하거나 응답한 뒤 이 시간(초) 안에 요청이 없으면 끊는다(0이면 끔) - 아무것도 보내지 않는 연결이 세션 칸을 채우지 못하게
loginIdleSec = 10;
// 로그인 서버: 서버 임시 RSA 키 쌍 수 - 시작할 때 만들고(하나에 약 55ms라 256개면 시작이 약 14초 늦어진다) 연결이 끝나면 돌려받는다. 키는 늘 이 수만큼이라
// ClientHello를 보낸 뒤 아직 끊기지 않은 연결 수의 상한 - 다 빌려 가면 새 접속은 끊는다(키쌍부족끊김). 2026-11-20 사용자 결정: 키를 그 자리에서 만들지 않고 수를 늘린다
loginKeyPool = 256;
// 로그인 서버: 서버 임시 키 하나를 몇 연결까지 쓸지(설계 암호화_구조_결정.docx 2-3) - 1이면 접속마다 새 키. 키가 새면 그 키를 쓴 연결들의 가입·로그인 요청이 함께 풀린다
loginKeyMaxUse = 5;
// 로그인 서버: 로그인 성공 응답(세션 키)을 보낸 뒤 이 시간(초) 안에 클라의 확인(AuthAck)이 없으면 끊는다 - 받으면 바로 끊는다
loginAckSec = 5;

// 게임 규칙(시나리오 표가 아니라 규칙)
playerHp = 20;
playerAttack = 2;
playerDefense = 12;
playerInvestigate = 0;
turnTimeMs = 10000;
dungeonGold = 50;
auctionDurationSec = 60;
// 접속한 뒤 이 시간(초) 안에 입장하지 않으면 끊는다(0이면 끔). 시험 클라는 띄우자마자 접속하고 사람이 가입·로그인을 치므로 짧게 두지 않는다
entryLimitSec = 60;
