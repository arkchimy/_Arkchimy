// EchoClient 송신 정체 시험 설정 - 받지 않고, 수신 버퍼를 작게 잡고, 서버 송신 링(32KB)보다 적게 보낸다
// 클라 수신 창이 금방 0이 되고 서버 WSASend가 대기로 남는다 → 송신 링은 안 넘치고 송신 정체로만 끊겨야 한다
// 서버를 sendBufZero = 1로 띄울 것 - 기본 송신 버퍼면 에코 16KB가 서버 커널 송신 버퍼에 다 들어가 WSASend가 바로 끝나고, 정체가 생기지 않아 시험이 아무것도 확인하지 못한다
// 서버 sendStallSec(기본 10초)보다 오래 돌릴 것. 짧은 시험은 서버 sendStallSec을 3으로 줄인다
// 클라는 보낸 뒤 보내지도 받지도 않아 서버가 끊어도 모르고 재연결하지 않는다 - 한 번 실행에 정체 끊김은 최대 64건(세션 수)
ip = 127.0.0.1;
port = 32000;
threadCnt = 1;
bytesPerConn = 16384;
noRecv = 1;
rcvBuf = 1024;
