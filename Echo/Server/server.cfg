// 에코 서버 실행 설정 (BOM 없는 UTF-8 - ParserLib가 BOM을 키로 읽는다)
port = 32000;
backlog = 512;
workerCnt = 2;
iocpConcurrency = 0;
slotCnt = 500;
maxSession = 1000;
gqcsEx = 1;
gqcsBatch = 64;
skipOnSuccess = 1;
mergeSends = 1;
sendStallSec = 10;
sendBufZero = 0;
testSendCompleteDelayMs = 0;
// 즉시 완료 반복 상한 - 연달아 즉시 끝난 수신·송신이 이 수에 닿으면 차례를 IOCP 큐 뒤로 넘긴다. 0이면 상한 없음(이 장치가 없던 동작)
skipLoopLimit = 3;
