// 채팅 받지 않는 클라 시험 - JoinOk까지만 받고 그 뒤 recv를 하지 않는다(채팅도 안 보냄). 같은 방 정상 클라의 방송이 쌓여 서버가 넘침끊김 또는 송신정체끊김으로 끊어야 한다
// 무응답 판정에 먼저 걸리지 않도록 하트비트를 1초마다 보낸다. 서버가 끊으면 하트비트 send가 실패해 알아채고 다시 연결한다
// 64세션, 방 0–3(서버 chatRoomCnt ≥ 4) - 정상 채팅 클라(client_chat.cfg)와 같은 방에 들어가야 받을 방송이 생긴다
ip = 127.0.0.1;
port = 32000;
threadCnt = 1;
sessionPerThread = 64;
overSend = 16;
msgSize = 32;
ratePerSession = 0;
roomSize = 16;
chatNoRecv = 1;
heartbeatSec = 1;
rcvBuf = 1024;
